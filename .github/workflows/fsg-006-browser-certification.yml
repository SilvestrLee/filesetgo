name: FSG-006 Browser Compatibility Certification

# Runs the full FSG-006 Playwright browser certification matrix — including
# WebKit — on a supported Linux runner. The macOS 12 coding-agent
# environment used to build FSG-006 cannot run a current, non-CVE-affected
# WebKit build at all (see docs/governance/DECISIONS.md ADR-019); this
# workflow exists specifically to obtain a real WebKit result from an
# environment that has no such constraint, per Product Office directive.
#
# This workflow is verification infrastructure, not a deployment. It does
# not publish anything, does not touch production, and only exercises the
# same local, browser-only processing architecture the rest of the test
# suite already exercises.
#
# FSG-006 delta recertification: the Node dependency install step uses a
# governed `npm ci` against the committed lockfile — the lockfile itself
# was corrected (a completeness gap in its optional platform-dependency
# entries, not a version change) so this now installs reproducibly on this
# runner. See the step's own comment and docs/governance/DECISIONS.md ADR-021.

on:
  workflow_dispatch:
  push:
    branches:
      - fsg-006-hardening-compatibility
      - fsg-006-delta-recertification

jobs:
  browser-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print certification commit
        run: |
          echo "Certification commit: $GITHUB_SHA"
          git log -1 --oneline

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        # FSG-006 delta recertification (Product Office directive §8-§11):
        # the previous `rm -f package-lock.json && npm install` workaround
        # is retired. The actual root cause was traced (not guessed): the
        # committed lockfile was missing several of rolldown's declared
        # platform-optional bindings — including `@rolldown/binding-linux-x64-gnu`,
        # the exact one this runner needs — because it had been regenerated
        # at some point without first removing a stale `node_modules/`, which
        # silently narrowed npm's written optional-dependency set to only
        # what was already present locally rather than the full declared
        # multi-platform graph. A clean regeneration (`rm -rf node_modules
        # package-lock.json && npm install` on the governed dev machine)
        # restored all 15 declared rolldown platform bindings to the lockfile
        # — verified directly: `npm ci` against the corrected lockfile now
        # installs cleanly and the full local baseline (typecheck/build/
        # test:core/test:ui) passes unchanged. No dependency version,
        # package manager, or Node/Vite major version was changed to reach
        # this fix — see docs/governance/DECISIONS.md ADR-021.
        run: npm ci

      - name: Print tool versions
        run: |
          node --version
          npm --version
          npm ls @playwright/test
          npx playwright --version

      - name: Install the governed Playwright browsers (Chromium, Firefox, WebKit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Prepare the Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --force

      - name: Build production assets
        run: npm run build

      - name: Run the full browser certification matrix
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsg-006-playwright-report
          path: tests/browser/.artifacts/
          retention-days: 14
